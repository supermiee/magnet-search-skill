# Torrent/magnet source registry
# Small personal-use source set. Keep this list intentionally short.
# Adapter fields are instructions for the agent so it does not re-invent
# site-specific search/extraction logic for every request.

checked_at: "2026-08-21"
verification_method: "direct HTTPS page check"

sources:
  - name: Sukebei Nyaa
    url: https://sukebei.nyaa.si/
    categories: [jav, hentai, anime, doujin]
    priority: 100
    status: inconclusive
    adapter:
      search: site-native-search
      result: search-result-or-detail-page
      magnet: anchor-href-starts-with-magnet-uri
      fallback: open-matching-detail-page-once
    notes: "Primary specialist source for Japanese adult/torrent content. Re-check before use if status is inconclusive."

  - name: OneJAV
    url: https://onejav.com/
    categories: [jav]
    priority: 95
    status: active
    adapter:
      search: site-native-search
      result: matching-JAV-result
      magnet: inspect-result-or-detail-page-for-magnet-or-infohash
      fallback: open-matching-detail-page-once
    notes: "JAV-focused source; direct check returned current listings."

  - name: U9A9
