    status: active
    adapter:
      search: site-native-search
      result: matching-magnet-result
      magnet: inspect-result-page-for-magnet-uri-or-infohash
      fallback: open-matching-detail-page-once
    notes: "High-value Asian/Chinese-oriented magnet source; direct check returned current listings."

  - name: BTSOW
