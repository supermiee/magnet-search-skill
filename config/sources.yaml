    priority: 90
    status: inconclusive
    adapter:
      search: site-native-search
      result: matching-torrent-result
      magnet: anchor-href-starts-with-magnet-uri
      fallback: open-matching-detail-page-once
    notes: "Anime/Asian specialist source. Re-check before use if status is inconclusive."

  - name: Bitsearch
    url: https://bitsearch.to/
    canonical_url: https://bitsearch.eu/
    categories: [general, asian, jav, anime]
    priority: 70
    status: redirect
    adapter:
      search: site-native-search
      result: matching-torrent-result
      magnet: inspect-result-or-detail-page-for-magnet-uri-or-infohash
      fallback: open-matching-detail-page-once
    notes: "Configured URL redirects to the current Bitsearch domain; prefer canonical_url."

# Adapter vocabulary
#
# search: site-native-search = use the site's own search UI/query mechanism.
# result: select the result whose title/identifier matches the user's exact query.
# magnet: anchor-href-starts-with-magnet-uri = find a link whose href begins
#         with magnet:?xt=urn:btih: and keep the complete URI.
# magnet: inspect-*-for-magnet-uri-or-infohash = inspect the result/detail
#         page for a complete Magnet URI or a clearly labeled InfoHash.
# fallback: open-matching-detail-page-once = if the result page has no Magnet,
#          open the matching detail/torrent page once; do not recursively crawl.
